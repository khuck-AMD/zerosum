<meta charset="utf-8">
<style>

path {
  stroke: #fff;
  fill-rule: evenodd;
}

text {
  font-family: Arial, sans-serif;
  font-size: 12px;
}

div.tooltip-donut {
     position: absolute;
     text-align: center;
     padding: .5rem;
     background: #FFFFFF;
     color: #313639;
     border: 1px solid #313639;
     border-radius: 8px;
     pointer-events: none;
     font-size: 1.3rem;
}

</style>
<body><h1>ZeroSum Utilization</h1>
<p>
<button onClick="window.location.reload();">Refresh Page / Reset Zoom</button>
<br>To see component details, click once. To zoom, double-click.
<br>Colors indicate MPI rank assignments % ranks per node:
</p>
<table>
<tr>
<td bgcolor="#d62728">&nbsp;0&nbsp;</td>
<td bgcolor="#1f77b4" style="color: white;">&nbsp;1&nbsp;</td>
<td bgcolor="#2ca02c" style="color: white;">&nbsp;2&nbsp;</td>
<td bgcolor="#ff7f0e">&nbsp;3&nbsp;</td>
<td bgcolor="#9467bd" style="color: white;">&nbsp;4&nbsp;</td>
<td bgcolor="yellow">&nbsp;5&nbsp;</td>
<td bgcolor="#8c564b" style="color: white;">&nbsp;6&nbsp;</td>
<td bgcolor="#bcbd22">&nbsp;7&nbsp;</td>
<td bgcolor="#17becf">&nbsp;8&nbsp;</td>
<td bgcolor="#e377c2">&nbsp;9&nbsp;</td>
<td bgcolor="darkgreen" style="color: white;">&nbsp;10&nbsp;</td>
<td bgcolor="#7f7f7f" style="color: white;">&nbsp;11&nbsp;</td>
</tr>
</table>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script type="module">

function getWidth() {
  return Math.max(
    document.body.scrollWidth,
    document.documentElement.scrollWidth,
    document.body.offsetWidth,
    document.documentElement.offsetWidth,
    document.documentElement.clientWidth
  );
}

function getHeight() {
  return Math.max(
    document.body.scrollHeight,
    document.documentElement.scrollHeight,
    document.body.offsetHeight,
    document.documentElement.offsetHeight,
    document.documentElement.clientHeight
  );
}

const width = getWidth();
const height = getHeight();
const radius = Math.min(width, height) / 2;
const angleOffset = 0;
const minLabelAngularSpan = 0.01;
const minLabelInnerRadius = 16;
let isZooming = false;

function colorChooser(rank) {
    const mycolors = [
/* tab:red : */ "#d62728",
/* tab:blue : */ "#1f77b4",
/* tab:green : */ "#2ca02c",
/* tab:orange : */ "#ff7f0e",
/* tab:purple : */ "#9467bd",
"yellow",
/* tab:brown : */ "#8c564b",
/* tab:olive : */ "#bcbd22",
/* tab:cyan : */ "#17becf",
/* tab:pink : */ "#e377c2",
"darkgreen",
/* tab:gray : */ "#7f7f7f",
];
    return mycolors[rank % 12];
}

function colorPerVariable(valueIn, rankIn) {
    if (rankIn >= 0) {
        return colorChooser(rankIn);
    }
    return "white";
}

function opacityPerVariable(valueIn, rankIn) {
    if (rankIn < 0) {
        return 0.15;
    }
    return Math.max(0.3, Math.min(1.0, valueIn / 100.0));
}

function detailField(detail, key) {
  const pattern = new RegExp('(?:^|, )' + key + ':\\s*([^,]+)');
  const match = detail.match(pattern);
  if (match && match[1]) {
    return match[1].trim();
  }
  return '';
}

function truncateLabel(label, maxChars) {
  if (!label) {
    return '';
  }
  if (label.length <= maxChars) {
    return label;
  }
  return label.slice(0, maxChars - 1) + '…';
}

function nodeLabel(data) {
  if (data.name && data.name.startsWith("Package")) {
    return "Package";
  }
  if (data.name && data.name.startsWith("PCIDev") && data.rank >= 0) {
    let gpuName = detailField(data.detail_name || "", "Name");
    if (gpuName.length === 0) {
      gpuName = detailField(data.detail_name || "", "PCIDevice");
    }
    if (gpuName.length > 0) {
      return truncateLabel(gpuName, 24);
    }
  }
  return truncateLabel(data.name || "", 24);
}

function nodeComparator(a, b) {
  const an = (a && a.data && a.data.name) ? a.data.name : "";
  const bn = (b && b.data && b.data.name) ? b.data.name : "";
  const aIsCore = an === "Core";
  const bIsCore = bn === "Core";
  if (aIsCore !== bIsCore) {
    return aIsCore ? -1 : 1;
  }
  const aIsBridge = an === "Bridge";
  const bIsBridge = bn === "Bridge";
  if (aIsBridge !== bIsBridge) {
    return aIsBridge ? 1 : -1;
  }
  const asi = (a && a.data && typeof a.data.sort_index === "number") ? a.data.sort_index : 0;
  const bsi = (b && b.data && typeof b.data.sort_index === "number") ? b.data.sort_index : 0;
  if (asi !== bsi) {
    return asi - bsi;
  }
  const ao = (a && a.data && typeof a.data.render_order === "number") ? a.data.render_order : 0;
  const bo = (b && b.data && typeof b.data.render_order === "number") ? b.data.render_order : 0;
  return ao - bo;
}

function computeTextRotation(node) {
  return (((node.x0 + node.x1) / 2) + angleOffset - Math.PI / 2) / Math.PI * 180;
}

function arcVisible(node) {
  return node.y1 <= radius && node.y0 >= 0 && node.x1 > node.x0;
}

function labelVisible(node) {
  return arcVisible(node) &&
         (node.x1 - node.x0) > minLabelAngularSpan &&
         labelRadius(node) >= minLabelInnerRadius;
}

function labelRadius(node) {
  return Math.max(0, node.y0);
}

const svg = d3.select("body").append("svg")
  .attr("width", width)
  .attr("height", height);

const chartGroup = svg.append("g")
  .attr("transform", "translate(" + width / 2 + "," + (height / 2 + 10) + ")");

const tooltip = d3.select("body").append("div")
  .attr("class", "tooltip-donut")
  .style("opacity", 0);

const myprofile = '$JSONDATA';
const json = JSON.parse(myprofile);

const root = d3.hierarchy(json)
  .sum((d) => (d.children && d.children.length > 0) ? 0 : 1)
  .sort(nodeComparator);
let focusNode = root;

d3.partition().size([2 * Math.PI, radius])(root);
root.each((d) => { d.current = { x0: d.x0, x1: d.x1, y0: d.y0, y1: d.y1 }; });

const arc = d3.arc()
  .startAngle((d) => d.x0 + angleOffset)
  .endAngle((d) => d.x1 + angleOffset)
  .innerRadius((d) => Math.max(0, d.y0))
  .outerRadius((d) => Math.max(0, d.y1));

const nodes = root.descendants().filter((d) => d.depth > 0);

const g = chartGroup.selectAll("g")
  .data(nodes)
  .enter()
  .append("g");

const path = g.append("path")
  .attr("d", (d) => arc(d.current))
  .style("fill", (d) => colorPerVariable(d.data.utilization, d.data.rank))
  .style("opacity", (d) => arcVisible(d.current) ? opacityPerVariable(d.data.utilization, d.data.rank) : 0)
  .style("stroke", "#9a9a9a")
  .style("pointer-events", (d) => arcVisible(d.current) ? "auto" : "none")
  .on("dblclick", function(event, d) { click(d); })
  .on("click", function(event, d) {
      if (isZooming) {
        return;
      }
      d3.select(this).transition()
           .duration(50)
           .attr("opacity", 0.85);
      tooltip.transition()
           .duration(50)
           .style("opacity", 1);
      let util = "";
      if (d.data.rank >= 0) {
        util = "<b>utilization: " + d.data.utilization.toFixed(2) + "</b><br>" +
               "<b>process rank: " + d.data.rank + "</b><br>";
      }
      const num = "<div align=\"left\" style=\"font-size:100%;\"><b>" + d.data.name + "</b><br>" +
                  util + (d.data.detail_name || "").replaceAll(", ", "<br>") + "</div>";
      tooltip.html(num)
           .style("left", "10px")
           .style("top", "200px");
   })
   .on("mouseover", function() {
      if (isZooming) {
        return;
      }
      d3.select(this).transition()
           .duration(50)
           .style("fill", "lightgrey")
           .style("stroke", "#6f6f6f")
           .attr("opacity", 0.85);
   })
   .on("mouseout", function(event, d) {
      if (isZooming) {
        return;
      }
      d3.select(this).transition()
           .duration(50)
           .style("fill", colorPerVariable(d.data.utilization, d.data.rank))
           .style("stroke", "#9a9a9a")
           .style("opacity", opacityPerVariable(d.data.utilization, d.data.rank));
   });

const text = g.append("text")
  .attr("transform", (d) => "rotate(" + computeTextRotation(d.current) + ")")
  .attr("fill", "black")
  .style("pointer-events", "none")
  .attr("x", (d) => labelRadius(d.current))
  .attr("dx", "6")
  .attr("text-anchor", "start")
  .attr("dy", ".35em")
  .attr("opacity", (d) => labelVisible(d.current) ? 1 : 0)
  .text((d) => nodeLabel(d.data));

text.each(function(d) {
  const lines = nodeLabel(d.data).split("\n");
  const textNode = d3.select(this);
  textNode.text(null);
  const firstDy = ((1 - lines.length) / 2) + "em";
  lines.forEach(function(line, idx) {
    textNode.append("tspan")
      .attr("dy", idx === 0 ? firstDy : "1.0em")
      .text(line);
  });
});

const centerText = chartGroup.append("text")
  .attr("text-anchor", "middle")
  .attr("dy", ".35em")
  .attr("fill", "black")
  .style("pointer-events", "none")
  .text(nodeLabel(root.data));

const centerHit = chartGroup.append("circle")
  .attr("r", minLabelInnerRadius + 8)
  .style("fill", "transparent")
  .style("cursor", "pointer")
  .on("click", function(event) {
    event.stopPropagation();
    if (isZooming) {
      return;
    }
    if (!focusNode || !focusNode.data) {
      return;
    }
    let util = "";
    if (focusNode.data.rank >= 0) {
      util = "<b>utilization: " + focusNode.data.utilization.toFixed(2) + "</b><br>" +
             "<b>process rank: " + focusNode.data.rank + "</b><br>";
    }
    const num = "<div align=\"left\" style=\"font-size:100%;\"><b>" + focusNode.data.name + "</b><br>" +
                util + (focusNode.data.detail_name || "").replaceAll(", ", "<br>") + "</div>";
    tooltip.transition()
      .duration(50)
      .style("opacity", 1);
    tooltip.html(num)
      .style("left", "10px")
      .style("top", "200px");
  })
  .on("dblclick", function(event) {
    event.stopPropagation();
    if (isZooming) {
      return;
    }
    if (focusNode && focusNode.parent) {
      click(focusNode.parent);
    }
  });

function click(target) {
  if (isZooming) {
    return;
  }

  isZooming = true;
  focusNode = target;
  path.style("pointer-events", "none");

  root.each(function(d) {
    d.target = {
      x0: Math.max(0, Math.min(1, (d.x0 - target.x0) / (target.x1 - target.x0))) * 2 * Math.PI,
      x1: Math.max(0, Math.min(1, (d.x1 - target.x0) / (target.x1 - target.x0))) * 2 * Math.PI,
      y0: Math.max(0, d.y0 - target.y0),
      y1: Math.max(0, d.y1 - target.y0)
    };
  });

  const t = chartGroup.transition().duration(750);
  path.transition(t)
    .filter(function(d) { return arcVisible(d.current) || arcVisible(d.target); })
    .tween("data", function(d) {
      const i = d3.interpolate(d.current, d.target);
      return function(step) {
        d.current = i(step);
      };
    })
    .style("opacity", function(d) {
      return arcVisible(d.target) ? opacityPerVariable(d.data.utilization, d.data.rank) : 0;
    })
    .style("pointer-events", function(d) {
      return arcVisible(d.target) ? "auto" : "none";
    })
    .attrTween("d", function(d) {
      return function() {
        return arc(d.current);
      };
    });

  text.transition(t)
    .filter(function(d) { return labelVisible(d.current) || labelVisible(d.target); })
    .attr("opacity", function(d) { return labelVisible(d.target) ? 1 : 0; })
    .attrTween("transform", function(d) {
      const i = d3.interpolate(d.current, d.target);
      return function(step) {
        const v = i(step);
        return "rotate(" + computeTextRotation(v) + ")";
      };
    })
    .attrTween("x", function(d) {
      const i = d3.interpolate(d.current, d.target);
      return function(step) {
        return labelRadius(i(step));
      };
    });

  centerText.text(nodeLabel(target.data));

  t.on("end interrupt", function() {
    isZooming = false;
    path.style("pointer-events", function(d) {
      return arcVisible(d.current) ? "auto" : "none";
    });
  });
}

</script>
