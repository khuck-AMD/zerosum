<meta charset="utf-8">
<style>

path {
  stroke: #fff;
  fill-rule: evenodd;
}

text {
  font-family: Arial, sans-serif;
  font-size: 12px;
}

div.tooltip-donut {
     position: absolute;
     text-align: center;
     padding: .5rem;
     background: #FFFFFF;
     color: #313639;
     border: 1px solid #313639;
     border-radius: 8px;
     pointer-events: none;
     font-size: 1.3rem;
}

</style>
<body><h1>ZeroSum Utilization</h1>
<p>
<button onClick="window.location.reload();">Refresh Page / Reset Zoom</button>
<br>To see component details, click once. To zoom, double-click.
<br>Colors indicate MPI rank assignments % ranks per node:
</p>
<table>
<tr>
<td bgcolor="#d62728">&nbsp;0&nbsp;</td>
<td bgcolor="#1f77b4" style="color: white;">&nbsp;1&nbsp;</td>
<td bgcolor="#2ca02c" style="color: white;">&nbsp;2&nbsp;</td>
<td bgcolor="#ff7f0e">&nbsp;3&nbsp;</td>
<td bgcolor="#9467bd" style="color: white;">&nbsp;4&nbsp;</td>
<td bgcolor="yellow">&nbsp;5&nbsp;</td>
<td bgcolor="#8c564b" style="color: white;">&nbsp;6&nbsp;</td>
<td bgcolor="#bcbd22">&nbsp;7&nbsp;</td>
<td bgcolor="#17becf">&nbsp;8&nbsp;</td>
<td bgcolor="#e377c2">&nbsp;9&nbsp;</td>
<td bgcolor="darkgreen" style="color: white;">&nbsp;10&nbsp;</td>
<td bgcolor="#7f7f7f" style="color: white;">&nbsp;11&nbsp;</td>
</tr>
</table>
<script src="https://cdn.jsdelivr.net/npm/d3@3"></script>
<script type="module">

function getWidth() {
  return Math.max(
    document.body.scrollWidth,
    document.documentElement.scrollWidth,
    document.body.offsetWidth,
    document.documentElement.offsetWidth,
    document.documentElement.clientWidth
  );
}

function getHeight() {
  return Math.max(
    document.body.scrollHeight,
    document.documentElement.scrollHeight,
    document.body.offsetHeight,
    document.documentElement.offsetHeight,
    document.documentElement.clientHeight
  );
}

var width = getWidth(),
    height = getHeight(),
    radius = Math.min(width, height) / 2;

var x = d3.scale.linear()
    .range([0, 2 * Math.PI]);
//var x = d3.scaleLinear([0, 2 * Math.PI]);

var y = d3.scale.linear()
    .range([0, radius]);
//var y = d3.scaleLinear([0, radius]);
var angleOffset = 0;

function colorChooser(rank) {
    //const mycolors = ["red","blue","lightgreen","orange","purple","yellow","brown","olive","cyan","pink","darkgreen","darkgrey"];
    const mycolors = [
/* tab:red : */ "#d62728",
/* tab:blue : */ "#1f77b4",
/* tab:green : */ "#2ca02c",
/* tab:orange : */ "#ff7f0e",
/* tab:purple : */ "#9467bd",
"yellow",
/* tab:brown : */ "#8c564b",
/* tab:olive : */ "#bcbd22",
/* tab:cyan : */ "#17becf",
/* tab:pink : */ "#e377c2",
"darkgreen",
/* tab:gray : */ "#7f7f7f",
];

    const maxcolors = 12;
    var index = (rank % maxcolors);
    return mycolors[index];
    //return mycolors[0];
}

// Color Scale
function colorPerVariable(value_in,rank_in) {
    if (rank_in >= 0) {
        // Keep rank assignment visually obvious even at low utilization.
        return colorChooser(rank_in);
    }
    return "white";
}

// Opacity Scale
function opacityPerVariable(value_in, rank_in) {
    if (rank_in < 0) {
        return 0.15;
    }
    return Math.max(0.3, Math.min(1.0, value_in / 100.0));
}

// Color Scale
function whiteOrNot(value,rank) {
    return "black";
}

var svg = d3.select("body").append("svg")
    .attr("width", width)
    .attr("height", height)
  .append("g")
    .attr("transform", "translate(" + width / 2 + "," + (height / 2 + 10) + ")");

var partition = d3.layout.partition()
    .sort(function(a, b) {
      var aIsCore = (a && a.name === "Core");
      var bIsCore = (b && b.name === "Core");
      if (aIsCore !== bIsCore) {
        return aIsCore ? -1 : 1;
      }

      var aIsBridge = (a && a.name === "Bridge");
      var bIsBridge = (b && b.name === "Bridge");
      if (aIsBridge !== bIsBridge) {
        return aIsBridge ? 1 : -1;
      }

      var asi = (typeof a.sort_index === "number") ? a.sort_index : 0;
      var bsi = (typeof b.sort_index === "number") ? b.sort_index : 0;
      if (asi !== bsi) {
        return asi - bsi;
      }
      var ao = (typeof a.render_order === "number") ? a.render_order : 0;
      var bo = (typeof b.render_order === "number") ? b.render_order : 0;
      return ao - bo;
    })
    .value(function(d) { return d.size; });

var arc = d3.svg.arc()
    .startAngle(function(d) { return x(d.x) + angleOffset; })
    .endAngle(function(d) { return x(d.x + d.dx) + angleOffset; })
    .innerRadius(function(d) { return Math.max(0, y(d.y)); })
    .outerRadius(function(d) { return Math.max(0, y(d.y + d.dy)); });

var myprofile = '$JSONDATA';
  var json = JSON.parse(myprofile);
  var g = svg.selectAll("g")
      .data(partition.nodes(json))
    .enter().append("g");

  var div = d3.select("body").append("div")
     .attr("class", "tooltip-donut")
     .style("opacity", 0);

  var path = g.append("path")
    .attr("d", arc)
    .style("fill", function(d) { return colorPerVariable(d.utilization,d.rank); })
    .style("opacity", function(d) { return opacityPerVariable(d.utilization,d.rank); })
    .style("stroke", "#9a9a9a")
    .on("dblclick", click)
    .on('click', function (d, i) {
          d3.select(this).transition()
               .duration('50')
               .attr('opacity', '.85');
          div.transition()
               .duration(50)
               .style("opacity", 1);
          let util = '';
          if (d.rank >= 0) {
            util = '<b>utilization: ' + d.utilization.toFixed(2) + '</b><br>' + '<b>process rank: ' + d.rank + '</b><br>';
          }
          let num = '<div align="left" style="font-size:100%;"><b>' + d.name + '</b><br>' + util + d.detail_name.replaceAll(', ', '<br>') + '</div>';
          div.html(num)
               .style("left", "10px")
               .style("top", "200px");
     })
     .on('mouseover', function () {
          d3.select(this).transition()
               .duration('50')
               .style("fill",'lightgrey')
               .style("stroke",'#6f6f6f')
               .attr('opacity', '.85');
     })
     .on('mouseout', function (d) {
          d3.select(this).transition()
               .duration('50')
               .style("fill", function(d) { return colorPerVariable(d.utilization,d.rank); })
               .style("stroke", "#9a9a9a")
               .style("opacity", function(d) { return opacityPerVariable(d.utilization,d.rank); });
     });

  var text = g.append("text")
    .attr("transform", function(d) { return "rotate(" + computeTextRotation(d) + ")"; })
    .attr("fill", function(d) { return whiteOrNot(d.utilization,d.rank); })
    .attr("x", function(d) { return y(d.y); })
    .attr("dx", "6") // margin
    .attr("text-anchor", "start")
    .attr("dy", ".35em") // vertical-align
    .text(function(d) { return nodeLabel(d); });

  text.each(function(d) {
    var lines = nodeLabel(d).split('\n');
    var textNode = d3.select(this);
    textNode.text(null);
    var firstDy = ((1 - lines.length) / 2) + "em";
    lines.forEach(function(line, idx) {
      textNode.append("tspan")
        .attr("dy", idx === 0 ? firstDy : "1.0em")
        .text(line);
    });
  });


  function click(d) {
    // fade out all text elements
    text.transition().attr("opacity", 0);

    path.transition()
      .duration(750)
      .attrTween("d", arcTween(d))
      .each("end", function(e, i) {
          // check if the animated element's data e lies within the visible angle span given in d
          if (e.x >= d.x && e.x < (d.x + d.dx)) {
            // get a selection of the associated text element
            var arcText = d3.select(this.parentNode).select("text");
            // fade in the text element and recalculate positions
            arcText.transition().duration(750)
              .attr("opacity", 1)
              .attr("transform", function() { return "rotate(" + computeTextRotation(e) + ")" })
              .attr("x", function(d) { return y(d.y); });
          }
      });
  }

d3.select(self.frameElement).style("height", height + "px");

// Interpolate the scales!
function arcTween(d) {
  var xd = d3.interpolate(x.domain(), [d.x, d.x + d.dx]),
      yd = d3.interpolate(y.domain(), [d.y, 1]),
      yr = d3.interpolate(y.range(), [d.y ? 20 : 0, radius]);
  return function(d, i) {
    return i
        ? function(t) { return arc(d); }
        : function(t) { x.domain(xd(t)); y.domain(yd(t)).range(yr(t)); return arc(d); };
  };
}

function computeTextRotation(d) {
  return (x(d.x + d.dx / 2) + angleOffset - Math.PI / 2) / Math.PI * 180;
}

function detailField(detail, key) {
  var pattern = new RegExp('(?:^|, )' + key + ':\\s*([^,]+)');
  var match = detail.match(pattern);
  if (match && match[1]) {
    return match[1].trim();
  }
  return '';
}

function truncateLabel(label, maxChars) {
  if (!label) {
    return '';
  }
  if (label.length <= maxChars) {
    return label;
  }
  return label.slice(0, maxChars - 1) + '…';
}

function packageLabel(label) {
  var words = label.trim().split(/\s+/).filter(Boolean);
  var maxWords = 5;
  if (words.length > maxWords) {
    words = words.slice(0, maxWords);
    words.push('…');
  }
  return words.join('\n');
}

function nodeLabel(d) {
  if (d.name && d.name.startsWith("Package")) {
    return "Package";
  }
  if (d.name && d.name.startsWith("PCIDev") && d.rank >= 0) {
    var gpuName = detailField(d.detail_name || "", "Name");
    if (gpuName.length === 0) {
      gpuName = detailField(d.detail_name || "", "PCIDevice");
    }
    if (gpuName.length > 0) {
      return truncateLabel(gpuName, 24);
    }
  }
  return truncateLabel(d.name, 24);
}

</script>
